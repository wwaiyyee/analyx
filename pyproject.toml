[project]
name = "analyx"
version = "0.1.0"
description = "Analyx — evidence-first AI data analyst"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "duckdb>=1.0,<2",
    "pandas>=2.2,<3",
    "pyarrow>=16,<20",
    "openpyxl>=3.1,<4",
    "chardet>=5,<6",
    "httpx>=0.27,<1",
    "sqlmodel>=0.0.19,<1",
    "pyyaml>=6,<7",
    "PyJWT>=2.8,<3",
    "PyNaCl>=1.5,<2",
    "base58>=2.1,<3",
    "anthropic>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "python-ulid>=2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
